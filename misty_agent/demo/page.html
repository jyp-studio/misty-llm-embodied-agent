<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misty — what the agent decided</title>
<style>
  :root {
    --ink: #e8e6e3; --dim: #8b8781; --faint: #4a4742;
    --bg: #16151a; --panel: #1e1d23; --line: #2c2a32;
    --boundary: #7c8fa8; --action: #d7d3cc; --result: #6fae83;
    --refused: #d0a24c; --failed: #cf6a5a; --spec: #8a7cc0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header { padding: 22px 26px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .picker button {
    font: inherit; font-size: 12.5px; color: var(--dim); cursor: pointer;
    background: transparent; border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 11px;
  }
  .picker button:hover { color: var(--ink); border-color: var(--faint); }
  .picker button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

  .provenance {
    margin: 16px 26px 0; padding: 11px 14px; border-radius: 6px;
    background: rgba(138,124,192,.09); border-left: 3px solid var(--spec);
    color: #cfc7e6; font-size: 12.5px;
  }
  .provenance b { color: #e3ddf5; font-weight: 600; }
  .provenance .caveat { display: block; margin-top: 5px; color: #a99fc4; }
  .provenance.later { background: rgba(208,162,76,.09); border-left-color: var(--refused); color: #e2cb9e; }
  .provenance.later b { color: #f0dcb4; }

  main { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 26px; padding: 20px 26px 60px; }
  /* Narrow: the robot goes above the list rather than below it, where it was
     off-screen for the whole run and so followed nothing. */
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    aside { order: -1; position: static; }
    ol.moments { max-height: none; }
  }

  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .controls button {
    font: inherit; background: var(--panel); color: var(--ink); cursor: pointer;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 13px; min-width: 74px;
  }
  .controls input[type=range] { flex: 1; accent-color: var(--dim); }
  .clock { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }

  ol.moments {
    list-style: none; margin: 0; padding: 0;
    /* Its own scroll box, so following the current Moment moves the list and
       not the window — the "this is a specification" banner used to leave the
       screen the moment anyone pressed Play. */
    max-height: 62vh; overflow-y: auto; overscroll-behavior: contain;
  }
  ol.moments li {
    display: grid; grid-template-columns: 62px 1fr; gap: 12px;
    padding: 3px 0 3px 10px; border-left: 2px solid transparent;
    opacity: .18; transition: opacity .16s ease, border-color .16s ease;
  }
  li.shown { opacity: 1; }
  li.now { border-left-color: var(--action); background: rgba(255,255,255,.03); }
  li .t { color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; font-size: 12.5px; }
  li.shown .t { color: var(--dim); }
  li .what { min-width: 0; }
  li .detail { color: var(--dim); }
  li.turn-mark { margin-top: 12px; }
  li[data-tone="boundary"] .head { color: var(--boundary); }
  li[data-tone="result"] .head { color: var(--result); }
  li[data-tone="refused"] .head { color: var(--refused); }
  li[data-tone="failed"] .head { color: var(--failed); }
  li[data-tone="refused"], li[data-tone="failed"] { padding-left: 8px; border-left-width: 2px; }
  li.shown[data-tone="refused"] { border-left-color: rgba(208,162,76,.5); }
  li.shown[data-tone="failed"] { border-left-color: rgba(207,106,90,.5); }

  aside { position: sticky; top: 18px; align-self: start; }
  .robot { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .robot h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  .robot dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 12px 0 0; font-size: 12.5px; }
  .robot dt { color: var(--faint); }
  .robot dd { margin: 0; color: var(--dim); font-variant-numeric: tabular-nums; }
  .robot .moves { margin: 10px 0 0; color: var(--faint); font-size: 11.5px; line-height: 1.45; }
  .outcome { margin-top: 12px; padding: 9px 11px; border-radius: 6px; background: rgba(255,255,255,.04); font-size: 12.5px; }
  .outcome b { color: var(--ink); font-weight: 600; }
  .outcome .running { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Misty — what the agent decided, turn by turn</h1>
  <div class="sub">A ReAct loop for a small social robot. The model chooses <i>whether</i> to act; a control layer decides how far.</div>
  <nav class="picker" id="picker" aria-label="Example episodes"></nav>
</header>

<div class="provenance" id="provenance"></div>

<main>
  <section>
    <div class="controls">
      <button id="play" type="button">Play</button>
      <input id="scrub" type="range" min="0" value="0" step="1" aria-label="Position in the episode">
      <span class="clock" id="clock">0.00s</span>
    </div>
    <ol class="moments" id="moments"></ol>
  </section>

  <aside>
    <div class="robot">
      <h2>Robot</h2>
      <svg viewBox="0 0 160 150" width="100%" role="img" aria-label="The robot's pose">
        <g id="head">
          <rect x="45" y="12" width="70" height="54" rx="11" fill="#2b2933" stroke="#3a3844"/>
          <circle id="eyeL" cx="66" cy="38" r="6.5" fill="#cfe7f5"/>
          <circle id="eyeR" cx="94" cy="38" r="6.5" fill="#cfe7f5"/>
          <path id="mouth" d="M70 51 Q80 56 90 51" stroke="#cfe7f5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
        <rect x="54" y="72" width="52" height="58" rx="10" fill="#26242e" stroke="#3a3844"/>
        <circle id="led" cx="80" cy="98" r="9" fill="#2c2a32" stroke="#3a3844"/>
        <g id="armL"><rect x="34" y="76" width="11" height="40" rx="5" fill="#2b2933" stroke="#3a3844"/></g>
        <g id="armR"><rect x="115" y="76" width="11" height="40" rx="5" fill="#2b2933" stroke="#3a3844"/></g>
      </svg>
      <dl>
        <dt>light</dt><dd id="dLed">off</dd>
        <dt>head</dt><dd id="dHead">level</dd>
        <dt>arms</dt><dd id="dArms">down</dd>
        <dt>face</dt><dd id="dFace">neutral</dd>
      </dl>
      <p class="moves" id="moves"></p>
      <div class="outcome" id="outcome"></div>
    </div>
  </aside>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { board: null, at: 0, timer: null };

const FACES = {
  happy:     { eyes: 6.5, mouth: "M70 50 Q80 58 90 50" },
  sad:       { eyes: 5.5, mouth: "M70 55 Q80 48 90 55" },
  angry:     { eyes: 4.5, mouth: "M70 55 Q80 50 90 55" },
  surprised: { eyes: 8.5, mouth: "M75 52 Q80 58 85 52" },
  love:      { eyes: 7.5, mouth: "M70 50 Q80 59 90 50" },
  afraid:    { eyes: 7.5, mouth: "M72 55 Q80 50 88 55" },
  neutral:   { eyes: 6.5, mouth: "M70 51 Q80 56 90 51" },
};

async function boot() {
  const examples = await (await fetch("/examples")).json();
  $("picker").innerHTML = examples
    .map((e, i) => `<button type="button" data-name="${e.name}" aria-pressed="${i === 0}">${e.title}</button>`)
    .join("");
  $("picker").addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (button) load(button.dataset.name);
  });
  load(examples[0].name);
}

async function load(name) {
  stop();
  for (const button of $("picker").querySelectorAll("button")) {
    button.setAttribute("aria-pressed", String(button.dataset.name === name));
  }
  const payload = await (await fetch("/examples/" + encodeURIComponent(name))).json();
  state.board = payload.storyboard;

  const first = payload.example.written_before_the_implementation;
  const banner = $("provenance");
  banner.className = "provenance" + (first ? "" : " later");
  banner.innerHTML = first
    ? `<b>This is a specification, not a recording.</b> ${escapeText(payload.example.provenance)}.`
      + `<span class="caveat">${escapeText(payload.example.amendments)}</span>`
    : `<b>This one came later.</b> ${escapeText(payload.example.provenance)}.`;

  const moves = payload.moves;
  $("moves").textContent = moves.length
    ? "moves here: " + moves.join(", ")
    : "nothing on this figure moves in this episode";

  draw();
  $("scrub").max = String(state.board.moments.length - 1);
  // Not scrolled: on first load `scrollIntoView` drags the whole page down
  // and the heading with it, so the demo opens halfway through itself.
  seek(0, { scroll: false });
}

function draw() {
  $("moments").innerHTML = state.board.moments
    .map((m, i) => {
      const turnMark = m.kind === "turn_started" ? " turn-mark" : "";
      // Headline and detail, and nothing this file composes itself. What a
      // record says was decided in `storyboard.py`, where pytest reaches it
      // (`PLAN.md` §16.4); a sentence assembled here is a sentence no test
      // in this repo can read.
      return `<li class="${turnMark}" data-tone="${m.tone}" data-i="${i}">
        <span class="t">${m.t.toFixed(2)}s</span>
        <span class="what">
          <span class="head">${escapeText(m.headline)}</span>${m.detail ? ` <span class="detail">${escapeText(m.detail)}</span>` : ""}
        </span>
      </li>`;
    })
    .join("");
}

function seek(index, { scroll = true } = {}) {
  state.at = Math.max(0, Math.min(index, state.board.moments.length - 1));
  $("scrub").value = String(state.at);
  const moment = state.board.moments[state.at];
  $("clock").textContent = moment.t.toFixed(2) + "s";

  for (const li of $("moments").children) {
    const i = Number(li.dataset.i);
    li.classList.toggle("shown", i <= state.at);
    li.classList.toggle("now", i === state.at);
  }
  if (scroll) {
    $("moments").children[state.at].scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  paint(moment.robot);

  const last = state.board.moments[state.board.moments.length - 1];
  const ended = state.at === state.board.moments.length - 1 && state.board.outcome;
  $("outcome").innerHTML = ended
    ? `<b>${escapeText(last.headline)}</b>${last.detail ? " — " + escapeText(last.detail) : ""}`
    : `<span class="running">running… turn ${moment.turn ?? "—"}</span>`;
}

function paint(robot) {
  const [r, g, b] = robot.led;
  const lit = r + g + b > 0;
  $("led").setAttribute("fill", lit ? `rgb(${r},${g},${b})` : "#2c2a32");
  $("led").style.filter = lit ? `drop-shadow(0 0 7px rgb(${r},${g},${b}))` : "none";
  $("dLed").textContent = lit ? `rgb(${r}, ${g}, ${b})` : "off";

  const [pitch, roll, yaw] = robot.head;
  // Yaw turns the head, pitch nods it, roll tilts it. Small factors: this is
  // a diagram of a pose, not a scale drawing of a robot nobody here has.
  $("head").setAttribute(
    "transform",
    `translate(${(yaw * 0.22).toFixed(2)} ${(pitch * 0.18).toFixed(2)}) rotate(${(roll * 0.3).toFixed(2)} 80 40)`
  );
  $("dHead").textContent = `pitch ${pitch}°  yaw ${yaw}°`;

  // -29 is straight up, 0 forward, 90 down — so the drawn angle is measured
  // from hanging down.
  const [left, right] = robot.arms;
  $("armL").setAttribute("transform", `rotate(${(90 - left).toFixed(1)} 39 80)`);
  $("armR").setAttribute("transform", `rotate(${(right - 90).toFixed(1)} 120 80)`);
  $("dArms").textContent = `${left}°  ${right}°`;

  const face = FACES[robot.expression] || FACES.neutral;
  $("eyeL").setAttribute("r", face.eyes);
  $("eyeR").setAttribute("r", face.eyes);
  $("mouth").setAttribute("d", face.mouth);
  $("dFace").textContent = robot.expression;
}

function play() {
  if (state.at >= state.board.moments.length - 1) seek(0);
  $("play").textContent = "Pause";
  const step = () => {
    if (state.at >= state.board.moments.length - 1) return stop();
    const here = state.board.moments[state.at].t;
    const next = state.board.moments[state.at + 1].t;
    seek(state.at + 1);
    // Real time, capped: the turn-limit example spans half a minute and
    // nobody watches a progress bar for that long.
    state.timer = setTimeout(step, Math.min((next - here) * 1000, 900) || 260);
  };
  state.timer = setTimeout(step, 260);
}

function stop() {
  clearTimeout(state.timer);
  state.timer = null;
  $("play").textContent = "Play";
}

function escapeText(text) {
  const node = document.createElement("span");
  node.textContent = String(text);
  return node.innerHTML;
}

$("play").addEventListener("click", () => (state.timer ? stop() : play()));
$("scrub").addEventListener("input", (event) => { stop(); seek(Number(event.target.value)); });
document.addEventListener("keydown", (event) => {
  if (event.key === " ") { event.preventDefault(); state.timer ? stop() : play(); }
  if (event.key === "ArrowRight") { stop(); seek(state.at + 1); }
  if (event.key === "ArrowLeft") { stop(); seek(state.at - 1); }
});

boot();
</script>
</body>
</html>
