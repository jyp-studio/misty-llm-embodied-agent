# Pytest configuration.
#
# In its own file rather than in `pyproject.toml`: this repo has no packaging
# metadata and adding a `pyproject.toml` to hold four lines of test config
# would look like the start of one. `tests/conftest.py` was the other
# candidate and is a protected file (`HANDOFF.md` §4).

[pytest]
markers =
    llm_live: calls a real model over the network, costs money, and needs
        OPENAI_API_KEY. Deselected by default — see `addopts` below.

# The default run must not reach the network, and must not *skip* either:
# "all green, zero skips" is a claim this project makes and M6 #08 showed how
# fast a flaky or skipped gate erodes it. Deselection keeps these tests out of
# the count entirely rather than parked in it as skips.
#
# To run them: `pytest -m llm_live` — a later `-m` overrides this one.
addopts = -m "not llm_live"
